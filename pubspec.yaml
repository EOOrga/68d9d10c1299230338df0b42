name: vefrix
description: Local operations board for resources, assets, maintenance, and containers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - docs/featured.png
    - docs/icon.png

flutter_launcher_icons:
  android: true
  image_path: docs/icon.png
  adaptive_icon_background: "#F54927"
  adaptive_icon_foreground: docs/icon.png
  min_sdk_android: 23
